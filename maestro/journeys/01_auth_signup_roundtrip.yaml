# Journey: auth ↔ signup round-trip, validation, then successful login
appId: host.exp.Exponent
tags:
  - journey
  - auth
  - ux
---
- runFlow:
    file: ../shared/ensure-logged-out.yaml

- openLink: ${EXPO_URL}/--/auth
- extendedWaitUntil:
    visible: "Welcome to GradLink|Continue|Sign In"
    timeout: 60000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

# Empty submit shows inline error
- tapOn: "Email"
- eraseText: 100
- eraseText: 100
- tapOn: "Password"
- eraseText: 100
- eraseText: 100
- tapOn:
    text: "Welcome to GradLink"
    optional: true
- scrollUntilVisible:
    element: "Sign In"
    direction: DOWN
    timeout: 5000
    visibilityPercentage: 50
- tapOn: "Sign In"
- assertVisible: "Please enter both email and password."

# Navigate to signup and back without losing auth chrome
- tapOn: "Sign up"
- extendedWaitUntil:
    visible: "Create Account|Continue|Sign In"
    timeout: 20000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- assertVisible: "Create Account"
- assertVisible: "Name|Email|Password"
- assertVisible: "Sign Up"

# Country picker open/close (escape + for Maestro regex)
- scrollUntilVisible:
    element: "Phone"
    direction: DOWN
    timeout: 8000
    visibilityPercentage: 40
- tapOn:
    text: "\\+1|\\+90|\\+44"
- extendedWaitUntil:
    visible: "Close|United Kingdom|Germany|India"
    timeout: 10000
- assertVisible: "United Kingdom"
- tapOn: "Close"
- assertVisible: "Create Account|Email|Password|Sign Up"

# Return to login
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Welcome to GradLink|Sign In|Email"
    timeout: 20000
- assertVisible: "Welcome to GradLink"
- assertVisible: "Sign In"

# Wrong password stays on auth with failure feedback
- tapOn: "Email"
- eraseText: 100
- eraseText: 100
- inputText: ${EMAIL}
- tapOn: "Password"
- eraseText: 100
- eraseText: 100
- inputText: "DefinitelyWrongPass999!"
- tapOn:
    text: "Welcome to GradLink"
    optional: true
- scrollUntilVisible:
    element: "Sign In"
    direction: DOWN
    timeout: 5000
    visibilityPercentage: 50
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: ".*[Ii]nvalid.*|.*[Ff]ailed.*|Authentication required|Please enter|Sign In|Welcome to GradLink"
    timeout: 20000
- assertVisible: "Sign In|Welcome to GradLink"

# Successful login lands on main tabs
- runFlow:
    file: ../shared/login.yaml
- assertVisible: "Timeline"
- assertVisible: "Groups"
- assertVisible: "Jobs"
- assertVisible: "Profile"
