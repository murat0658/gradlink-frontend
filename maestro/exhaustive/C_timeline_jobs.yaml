appId: host.exp.Exponent
tags: [exhaustive, timeline, jobs]
---

- runFlow:
    file: ../shared/login.yaml


# === S021 tabs-all-four-visible ===
- assertVisible: "Timeline"
- assertVisible: "Groups"
- assertVisible: "Jobs"
- assertVisible: "Profile"


# === S022 timeline-header-ui ===
- tapOn: "Timeline"
- extendedWaitUntil:
    visible: "Your Timeline|Show past events|Timeline"
    timeout: 20000
- assertVisible: "Your Timeline|Timeline"
- assertVisible: "Show past events"


# === S023 timeline-subtitle-or-empty ===
- assertVisible: "See your activity|No updates yet|Show past events|Your Timeline"


# === S024 timeline-past-toggle-ui ===
- assertVisible: "Show past events"
- tapOn: "Show past events"


# === S025 timeline-dismiss-banner-optional ===
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"


# === S026 jobs-tab-header-ui ===
- openLink: ${EXPO_URL}/--/(tabs)/jobs
- extendedWaitUntil:
    visible: "Jobs|No job postings yet|Career listings|Continue"
    timeout: 20000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: ".*Access denied.*|.*Error message.*"
    commands:
      - tapOn:
          point: "50%,92%"
- assertVisible: "Jobs"


# === S027 jobs-empty-or-list-ui ===
- assertVisible: "No job postings yet|Apply|Applied|Open link|Career listings"


# === S028 jobs-subtitle-ui ===
- assertVisible: ".*Career listings.*|.*alumni groups.*|No job postings yet"


# === S029 jobs-empty-guidance-ui ===
- assertVisible: "No job postings yet|Post a job|Apply|Jobs"


# === S030 jobs-member-post-hint-ui ===
- assertVisible: ".*group.*Jobs.*|No job postings yet|Apply|Jobs"


# === S031–S034 reserved (live listings depend on seeded data) ===
- assertVisible: "Jobs"
